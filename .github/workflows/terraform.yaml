name: Terraform

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/preprod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        run: |
          az login \
            --service-principal \
            --username "5c921314-4fe6-4acd-84b7-94eb6939e25d" \
            --password "8ed25deb-55c4-4c54-b544-f2874fde38d5" \
            --tenant "c8f1af26-7fc1-4c5a-a985-e119d2abba15"

      - name: Set Azure Subscription
        run: |
          az account set \
            --subscription "508c72f2-b2b1-4bfe-ab0c-37f1b8207727"

      - name: Check Azure Login
        run: az account show

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    needs: terraform-plan

    # Apply ONLY after push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: environments/preprod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        run: |
          az login \
            --service-principal \
            --username "5c921314-4fe6-4acd-84b7-94eb6939e25d" \
            --password "8ed25deb-55c4-4c54-b544-f2874fde38d5" \
            --tenant "c8f1af26-7fc1-4c5a-a985-e119d2abba15"

      - name: Set Azure Subscription
        run: |
          az account set \
            --subscription "508c72f2-b2b1-4bfe-ab0c-37f1b8207727"

      - name: Check Azure Login
        run: az account show

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan